        <style>
            :root {
                --font-ui: "Geist Variable", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                --font-mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
                --text-small: 0.8125rem;
                --text-body: 0.9375rem;
                --text-heading: 1.125rem;
                --text-title: 1.75rem;
                --space-1: 4px;
                --space-2: 8px;
                --space-3: 12px;
                --space-4: 16px;
                --space-6: 24px;
                --space-8: 32px;
            }

            html {
                background: var(--background);
                color-scheme: dark;
                font-family: var(--font-ui);
                font-size: 16px;
                line-height: 1.5;
            }

            body {
                min-width: 320px;
                margin: 0;
                color: var(--foreground);
                background: var(--background);
            }

            #inspectorDiv {
                min-height: 100vh;
                background: var(--background);
            }

            #canvasDiv {
                background: var(--background);
                box-shadow: inset 0 1px 0 var(--border);
            }

            #drawCanvas {
                display: block;
            }

            a {
                color: inherit;
            }

            button,
            input,
            textarea {
                box-sizing: border-box;
            }

            /* This block is unlayered, so `font: inherit` would outrank Tailwind's utilities
               layer. shadcn buttons carry their own type via text-sm/font-medium, so they are
               excluded here the same way they are from the button styling below. */
            button:not([data-slot="button"]),
            input,
            textarea {
                font: inherit;
            }

            button:not([data-slot="button"]) {
                min-height: 32px;
                padding: 5px var(--space-3);
                color: var(--secondary-foreground);
                background: var(--secondary);
                border: 1px solid var(--border);
                border-radius: 8px;
                font-size: 0.875rem;
                font-weight: 550;
                line-height: 1.25;
                cursor: pointer;
                transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease;
            }

            button:not([data-slot="button"]):hover:not(:disabled) {
                color: var(--foreground);
                background: var(--accent);
                border-color: color-mix(in oklch, var(--primary), var(--border) 45%);
            }

            button:not([data-slot="button"]):disabled {
                cursor: not-allowed;
                opacity: 0.48;
            }

            input[type="text"],
            textarea {
                min-height: 32px;
                padding: 6px 9px;
                color: var(--foreground);
                background: color-mix(in oklch, var(--background), white 2%);
                border: 1px solid var(--input);
                border-radius: 8px;
                outline: none;
            }

            input[type="text"]::placeholder,
            textarea::placeholder {
                color: var(--muted-foreground);
            }

            input[type="checkbox"] {
                accent-color: var(--primary);
            }

            :focus-visible {
                outline: 3px solid color-mix(in oklch, var(--ring), transparent 48%);
                outline-offset: 2px;
            }

            input[type="text"]:focus,
            textarea:focus {
                border-color: var(--ring);
                box-shadow: 0 0 0 3px color-mix(in oklch, var(--ring), transparent 72%);
            }

            .app-toolbar {
                display: flex;
                min-height: 52px;
                align-items: center;
                flex-wrap: wrap;
                gap: var(--space-2) var(--space-3);
                padding: var(--space-2) var(--space-3);
            }

            .app-brand {
                display: flex;
                align-items: center;
                gap: var(--space-2);
                white-space: nowrap;
            }

            .app-brand-mark {
                display: inline-flex;
                width: 32px;
                height: 32px;
                align-items: center;
                justify-content: center;
                border-radius: 10px;
            }

            .app-brand-mark svg {
                width: 17px;
                height: 17px;
            }

            .app-brand-copy {
                display: grid;
                line-height: 1.1;
            }

            .app-brand-copy strong {
                font-size: 0.9375rem;
                letter-spacing: -0.01em;
            }

            .app-brand-copy small {
                margin-top: 3px;
                color: var(--muted-foreground);
                font-size: 0.6875rem;
                font-weight: 450;
            }

            .app-toolbar-separator {
                height: 28px;
            }

            .app-toolbar-actions {
                display: flex;
                align-items: center;
                flex-wrap: wrap;
                gap: var(--space-2);
            }

            .app-version {
                margin-left: auto;
                font-size: var(--text-small);
                font-variant-numeric: tabular-nums;
            }

            .dialog-overlay {
                position: fixed;
                inset: 0;
                z-index: 10;
                background: color-mix(in oklch, var(--background), transparent 16%);
                backdrop-filter: blur(7px);
            }

            .dialog-layout {
                position: fixed;
                top: 50%;
                left: 50%;
                z-index: 11;
                display: flex;
                width: fit-content;
                max-width: calc(100vw - 48px);
                max-height: calc(100vh - 48px);
                align-items: stretch;
                gap: var(--space-3);
                overflow: auto;
                transform: translate(-50%, -50%);
            }

            .dialog-panel,
            .example-panel {
                box-sizing: border-box;
                color: var(--card-foreground);
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 12px;
                box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
            }

            .dialog-panel {
                padding: var(--space-6);
            }

            .dialog-header {
                display: grid;
                gap: var(--space-1);
            }

            .dialog-eyebrow {
                margin: 0;
                color: color-mix(in oklch, var(--primary), white 20%);
                font-size: 0.6875rem;
                font-weight: 650;
                letter-spacing: 0.1em;
                text-transform: uppercase;
            }

            .dialog-title {
                margin: 0;
                font-size: var(--text-title);
                font-weight: 650;
                letter-spacing: -0.025em;
                line-height: 1.15;
            }

            .dialog-description {
                margin: 0;
                color: var(--muted-foreground);
                font-size: var(--text-body);
            }

            .welcome-panel {
                display: flex;
                width: 500px;
                flex-direction: column;
                justify-content: center;
                text-align: center;
            }

            .welcome-title {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: var(--space-2);
                margin: 0;
                font-size: var(--text-title);
                font-weight: 650;
                letter-spacing: -0.025em;
                line-height: 1.2;
            }

            .welcome-title svg {
                width: 32px;
                height: 32px;
                color: color-mix(in oklch, var(--primary), white 22%);
                filter: drop-shadow(0 0 9px color-mix(in oklch, var(--ring), transparent 40%));
            }

            .welcome-tagline {
                margin-top: var(--space-1);
                color: var(--muted-foreground);
                font-size: var(--text-body);
            }

            .welcome-primary {
                margin: var(--space-6) 0;
            }

            .welcome-primary-action {
                width: 100%;
                min-height: 44px;
                color: var(--primary-foreground) !important;
                background: var(--primary) !important;
                border-color: transparent !important;
                font-size: 0.9375rem !important;
            }

            .welcome-primary-action:hover:not(:disabled) {
                background: color-mix(in oklch, var(--primary), white 8%) !important;
            }

            .resource-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: var(--space-2);
            }

            .resource-card {
                display: flex;
                min-height: 104px;
                align-items: center;
                justify-content: center;
                padding: var(--space-3);
                color: var(--muted-foreground);
                background: color-mix(in oklch, var(--muted), transparent 38%);
                border: 1px solid var(--border);
                border-radius: 10px;
                font-size: 0.875rem;
                font-weight: 550;
                text-align: center;
                text-decoration: none;
                transition: background-color 140ms ease, border-color 140ms ease, color 140ms ease, transform 140ms ease;
            }

            .resource-card:hover {
                color: var(--foreground);
                background: var(--accent);
                border-color: color-mix(in oklch, var(--ring), var(--border) 45%);
                transform: translateY(-1px);
            }

            .resource-card-content {
                display: grid;
                justify-items: center;
                gap: var(--space-2);
            }

            .resource-card svg {
                width: 38px;
                height: 38px;
            }

            .example-panel {
                min-width: 260px;
                padding: var(--space-4);
            }

            .example-heading {
                display: block;
                margin: 0 0 var(--space-3);
                font-size: var(--text-heading);
                font-weight: 650;
            }

            .example-links {
                display: grid;
                gap: 2px;
            }

            .example-links a {
                padding: 7px var(--space-2);
                color: var(--muted-foreground);
                border-radius: 7px;
                font-size: 0.875rem;
                text-decoration: none;
                transition: background-color 140ms ease, color 140ms ease;
            }

            .example-links a:hover {
                color: var(--foreground);
                background: var(--accent);
            }

            .dialog-stack {
                display: grid;
                width: min(780px, calc(100vw - 48px));
                gap: var(--space-3);
            }

            .dialog-stack > .dialog-header {
                margin-bottom: var(--space-2);
            }

            .dialog-section {
                display: grid;
                gap: var(--space-3);
                padding: var(--space-4);
                background: color-mix(in oklch, var(--muted), transparent 48%);
                border: 1px solid var(--border);
                border-radius: 10px;
            }

            .dialog-section-heading {
                color: var(--muted-foreground);
                font-size: 0.875rem;
            }

            .dialog-section-title {
                color: var(--foreground);
                font-size: 0.9375rem;
                font-weight: 650;
            }

            .dialog-section-body {
                display: grid;
                gap: var(--space-2);
            }

            .dialog-action-row,
            .checkbox-row {
                display: flex;
                align-items: center;
                gap: var(--space-2);
            }

            .checkbox-row {
                color: var(--muted-foreground);
                font-size: 0.875rem;
            }

            .copy-result {
                color: color-mix(in oklch, var(--ring), white 14%);
                font-size: var(--text-small);
                font-weight: 600;
            }

            .output-box {
                box-sizing: border-box;
                width: 100%;
                max-height: 110px;
                overflow: auto;
                margin: 0;
                padding: var(--space-3);
                color: var(--muted-foreground);
                background: color-mix(in oklch, var(--background), white 2%);
                border: 1px solid var(--border);
                border-radius: 8px;
                font-family: var(--font-mono);
                font-size: var(--text-small);
                line-height: 1.45;
                overflow-wrap: anywhere;
            }

            .output-box a {
                color: color-mix(in oklch, var(--ring), white 12%);
            }

            .forge-dialog {
                width: min(1040px, calc(100vw - 48px));
            }

            .forge-dialog > .dialog-header {
                margin-bottom: var(--space-6);
            }

            .forge-grid {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr) auto minmax(0, 1fr);
                align-items: stretch;
                gap: var(--space-3);
            }

            .forge-method {
                display: flex;
                min-width: 0;
                flex-direction: column;
                gap: var(--space-3);
                padding: var(--space-4);
                background: color-mix(in oklch, var(--muted), transparent 48%);
                border: 1px solid var(--border);
                border-radius: 10px;
            }

            .forge-method h2 {
                margin: 0;
                font-size: var(--text-heading);
                font-weight: 650;
                letter-spacing: -0.015em;
            }

            .forge-fields {
                display: grid;
                gap: var(--space-2);
            }

            .forge-field {
                display: grid;
                gap: var(--space-1);
                color: var(--muted-foreground);
                font-size: var(--text-small);
            }

            .forge-field input,
            .forge-field textarea {
                width: 100%;
            }

            .forge-field textarea {
                min-height: 116px;
                resize: vertical;
            }

            .forge-preview {
                display: block;
                width: 100%;
                height: auto;
                margin-top: auto;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
            }

            .forge-choice-divider {
                display: flex;
                align-items: center;
                color: var(--muted-foreground);
                font-size: 0.6875rem;
                font-weight: 700;
                letter-spacing: 0.08em;
                text-transform: uppercase;
            }

            .forge-stats {
                min-height: 41px;
                color: var(--muted-foreground);
                font-size: var(--text-small);
            }

            .forge-method > button {
                width: 100%;
                margin-top: auto;
            }

            #gate-forge-matrix-fix:not(:checked) + .matrix-fix-label {
                color: var(--destructive);
                font-weight: 650;
            }

            .error-panel {
                padding: var(--space-6);
                color: var(--destructive);
                background: var(--card);
                border: 1px solid color-mix(in oklch, var(--destructive), transparent 50%);
                border-radius: 12px;
                font-family: var(--font-mono);
                font-size: var(--text-title);
            }

            .error-panel-details {
                font-size: var(--text-body);
            }

            .error-panel-note {
                font-size: var(--text-heading);
            }

            .error-panel-screenshot {
                max-width: 600px;
                max-height: 250px;
            }

            @media (prefers-reduced-motion: reduce) {
                *,
                *::before,
                *::after {
                    scroll-behavior: auto !important;
                    transition-duration: 0.01ms !important;
                }
            }

            @media (max-width: 920px) {
                .app-brand-copy small,
                .app-toolbar-separator,
                .app-version {
                    display: none;
                }

                .forge-grid {
                    grid-template-columns: 1fr;
                }

                .forge-choice-divider {
                    justify-content: center;
                }
            }

            @media (max-width: 760px) {
                .app-toolbar {
                    align-items: flex-start;
                }

                .app-toolbar-actions {
                    flex: 1 1 100%;
                }

                .dialog-layout {
                    top: var(--space-3);
                    right: var(--space-3);
                    bottom: var(--space-3);
                    left: var(--space-3);
                    width: auto;
                    max-width: none;
                    max-height: none;
                    flex-direction: column;
                    transform: none;
                }

                .dialog-panel,
                .welcome-panel,
                .example-panel,
                .dialog-stack,
                .forge-dialog {
                    width: 100%;
                    box-sizing: border-box;
                }

                .dialog-panel,
                .welcome-panel,
                .example-panel {
                    padding: var(--space-4);
                }

                .resource-grid {
                    grid-template-columns: 1fr;
                }

                .resource-card {
                    min-height: 72px;
                }
            }
        </style>

        <!-- Whatever is between these start/end analytic tags is stripped by the 'downloading offline copy' code. -->

        <!-- End Analytics -->
    </head>

            <div id="app-toolbar-root"></div>

            <div id="canvasDiv" style="width: 100%; touch-action: manipulation; tab-index: 0; position: relative;">
                <canvas id="drawCanvas"></canvas>
            </div>

        <!-- Javascript detection -->
        <div id="noscript-div" class="noscript-warning" style="
                        animation-duration: 3.0s;
                   -moz-animation-duration: 3.0s;
                -webkit-animation-duration: 3.0s;
