    <body>
        <!-- Primary content -->
        <div id="inspectorDiv" style="display: none">
            <!-- Buttons -->
            <div id="app-toolbar-root"></div>

            <!-- Playhead transport controls -->
            <div id="transport-bar-root"></div>

            <!-- Gate palette beside the circuit -->
            <div class="app-body">
                <div id="gate-toolbox-root"></div>

                <!-- Circuit drawing area, with the zoom and overview overlay pinned over it -->
                <div id="circuit-area">
                    <div id="canvasDiv" style="touch-action: manipulation; position: relative;">
                        <canvas id="drawCanvas"></canvas>
                    </div>
                    <div id="circuit-overlay"></div>
                </div>
            </div>

            <!-- INCLUDE STATE PART -->


        </div>


        <!-- INCLUDE ERROR PART -->

        <!-- Dialog panels. Parked here while closed; src/components/app-dialogs.jsx moves each
             into its Base UI popup when it opens, so the ids and listeners survive. -->
        <div id="dialog-stash" hidden>
            <div id="menu-dialog-content" class="dialog-content">
                <!-- INCLUDE MENU PART -->
            </div>
            <div id="export-dialog-content" class="dialog-content">
                <!-- INCLUDE EXPORT PART -->
            </div>
            <div id="forge-dialog-content" class="dialog-content">
                <!-- INCLUDE FORGE PART -->
            </div>
            <div id="gate-param-dialog-content" class="dialog-content">
                <div class="dialog-panel gate-param-panel" aria-labelledby="gate-param-title">
                    <header class="dialog-header">
                        <h2 id="gate-param-title" class="gate-param-title"></h2>
                    </header>
                    <p id="gate-param-message" class="gate-param-message"></p>
                    <input id="gate-param-input" class="gate-param-input" type="text"
                           aria-label="Parameter value" autocomplete="off" spellcheck="false">
                    <p id="gate-param-error" class="gate-param-error" role="alert" hidden></p>
                    <div class="dialog-action-row gate-param-actions">
                        <button tabindex="120" id="gate-param-apply-button" type="button">Apply</button>
                        <button tabindex="121" id="gate-param-cancel-button" type="button">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Javascript detection -->
        <div id="noscript-div" class="noscript-warning"
             style="animation: 3s delay-showing-before-hide-script-can-run-but-then-jump-in;
                    background-color: white; border: 1px solid red; padding: 10px;">
            You appear to have JavaScript blocked. And Shadow-Quant is made out of JavaScript... :(
        </div>
        <script>
          document.getElementById('noscript-div').style.display = 'none';
        </script>

        <script>

          document.getElementById('noscript-div').style.display = 'none';

document.DEFAULT_CIRCUIT = undefined;
