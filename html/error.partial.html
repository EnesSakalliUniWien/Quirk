<div id="error-div" class="error-panel" style="display:none;">
    <div id="error-happened-div">An error happened. :(</div>
    <div id="error-message-div" class="error-panel-details"></div>
    <div id="error-known-div" class="error-panel-note">
        <br>
        <a id="error-known-issue-anchor">See more / complain about this issue on github</a>.
        <br>
        <br>
    </div>
    <div id="error-report-div">
        <br>
        Please report it:
        <ul class="error-panel-note">
            <li>
                <a id="error-github-anchor">Create an issue on github</a>
                (requires an account)
                (repository: <a href="https://github.com/Strilanc/Quirk">Strilanc/Quirk</a>)
            </li>
            <li>
                or <a id="error-mailto-anchor"></a>
            </li>
        </ul>
        <br>
        <br>
        Useful details to mention (auto-included if you use the create/email links above):
        <div class="error-panel-details">
            <br>
            <div id="error-description-div"></div>
            <br>
            PRE-DRAWN
            <br>
            <img id="error-image-pre" src="#" class="error-panel-screenshot"/>
            <br>
            POST-DRAWN
            <br>
            <img id="error-image-post" src="#" class="error-panel-screenshot"/>
        </div>
    </div>
</div>
