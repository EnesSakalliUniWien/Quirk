name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build-and-run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.12.0
        cache: npm
    - run: npm ci
    # Ubuntu 24.04 runners restrict unprivileged user namespaces, which Chrome's sandbox needs.
    - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - run: npm test
    - run: npm run test:e2e
  screenshot-circuit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.12.0
        cache: npm
    - run: npm ci
    # Ubuntu 24.04 runners restrict unprivileged user namespaces, which Chrome's sandbox needs.
    - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - run: npm run build
    - run: node PuppeteerScreenshotCircuit.js
    - uses: actions/upload-artifact@v4
      with:
        name: screenshot
        path: screenshot.png
