name: ci
# Temporarily disabled: runs only when triggered by hand from the Actions tab.
# To reactivate, restore:  on: [push, pull_request]
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build-and-run-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.12.0
        cache: npm
    - run: npm ci
    - run: npm test
    - run: npm run test:e2e
  screenshot-circuit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22.12.0
        cache: npm
    - run: npm ci
    - run: npm run build
    - run: node PuppeteerScreenshotCircuit.js
    - uses: actions/upload-artifact@v4
      with:
        name: screenshot
        path: screenshot.png
