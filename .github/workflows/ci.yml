name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  screenshot-circuit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 runners restrict unprivileged user namespaces, which Chrome's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run build
      - run: node scripts/screenshot-circuit.js
      - uses: actions/upload-artifact@v7
        with:
          name: screenshot
          path: screenshot.png
